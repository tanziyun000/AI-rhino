name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile core scripts
        run: python -m py_compile residential-unit-generator/tools/*.py residential-unit-generator/gh/code.py residential-unit-generator/gh/GH_Interface.py residential-unit-generator/run_prototype.py
      - name: Run tests
        run: python residential-unit-generator/tests/run_tests.py
      - name: Build report pack
        run: python residential-unit-generator/tools/generate_report_pack.py residential-unit-generator/configs/unit_matrix.json --unit-count 1 --policy-count 1 --out-dir residential-unit-generator/results/report_pack_ci
      - name: Verify report pack
        run: python residential-unit-generator/tools/generate_report_pack.py residential-unit-generator/configs/unit_matrix.json --unit-count 1 --policy-count 1 --out-dir residential-unit-generator/results/report_pack_ci --verify
      - name: Summarize report pack
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('residential-unit-generator/results/report_pack_ci/report_pack_summary.json')
          if not path.exists():
              print('report_pack_summary.json not found')
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding='utf-8'))
          print('Report pack status:', data.get('status'))
          print('Unit report:', data.get('unit_report_path'))
          print('Policy report:', data.get('policy_report_path'))
          print('Dashboard:', data.get('dashboard_path'))
          checks = data.get('checks', [])
          if checks:
              print('Checks:')
              for item in checks:
                  print(f"- {item.get('name')}: {item.get('status')} - {item.get('message')}")
          PY
      - name: Upload report pack artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-pack-ci
          path: residential-unit-generator/results/report_pack_ci/
          if-no-files-found: warn
